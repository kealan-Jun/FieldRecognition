<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">FieldRecognition — 从现场画面，到可追溯读数</title>
  <desc id="desc">项目流程示意，非产品截图。视频二维码用于确认仪器身份；照片和视频观测经过识别后，保留原图、时间及已有绑定证据。示意卡片不包含真实仪器测量结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102d35"/><stop offset="1" stop-color="#07171f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#3fceb1" stop-opacity=".19"/><stop offset="1" stop-color="#3fceb1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8ce5cd"/><stop offset="1" stop-color="#43b4b9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a4d9d6" stroke-opacity=".045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#75d8c1" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1600" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="600" rx="28" fill="url(#grid)"/>
  <ellipse cx="1140" cy="290" rx="480" ry="380" fill="url(#glow)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <rect x="76" y="77" width="8" height="16" rx="4" fill="#8ce5cd"/>
    <text x="101" y="92" fill="#a1d5cf" font-size="17" font-weight="600" letter-spacing="3">FIELD RECOGNITION</text>
    <text x="72" y="208" fill="#f3fbf9" font-size="62" font-weight="700">从现场画面，</text>
    <text x="72" y="293" fill="#91e4cc" font-size="62" font-weight="700">到可追溯读数。</text>
    <text x="77" y="353" fill="#a5c0c5" font-size="22">识别仪器 · 读取面板 · 留存证据</text>
    <g font-size="15" font-weight="500" fill="#c9e3e2">
      <rect x="76" y="405" width="138" height="39" rx="19.5" fill="#173940" stroke="#2f555d"/>
      <text x="145" y="431" text-anchor="middle">QR BINDING</text>
      <rect x="226" y="405" width="136" height="39" rx="19.5" fill="#173940" stroke="#2f555d"/>
      <text x="294" y="431" text-anchor="middle">LOCAL OCR</text>
      <rect x="374" y="405" width="148" height="39" rx="19.5" fill="#173940" stroke="#2f555d"/>
      <text x="448" y="431" text-anchor="middle">PHOTO TRACE</text>
    </g>
    <path d="M77 507H619" stroke="#294950"/>
    <text x="77" y="540" fill="#789da4" font-size="15" letter-spacing="1">A PHOTO. A TIME. AN EVIDENCE TRAIL.</text>
    <!-- Original vector illustration: identity, observation and retained evidence. -->
    <rect x="763" y="78" width="318" height="302" rx="20" fill="#12333a" stroke="#3d646a"/>
    <circle cx="788" cy="104" r="4" fill="#85dec5"/>
    <text x="802" y="110" fill="#badad9" font-size="14" letter-spacing="1.4">01 / INSTRUMENT IDENTITY</text>
    <rect x="804" y="139" width="235" height="177" rx="13" fill="#0b222b"/>
    <g fill="none" stroke="#89e1c7" stroke-width="3" stroke-linecap="round">
      <path d="M824 173V159H842 M1000 159H1019V177 M824 280V296H842 M1000 296H1019V279"/>
    </g>
    <g transform="translate(874 181)" fill="#d7f5ec">
      <path d="M0 0H35V35H0ZM7 7V28H28V7Z M58 0H93V35H58ZM65 7V28H86V7Z M0 58H35V93H0ZM7 65V86H28V65Z" fill-rule="evenodd"/>
      <path d="M14 14H21V21H14Z M72 14H79V21H72Z M14 72H21V79H14Z M42 0H49V21H42Z M42 28H49V49H35V42H42Z M0 42H21V49H0Z M56 42H77V49H63V63H56Z M84 42H93V56H84Z M42 56H49V77H42Z M56 70H70V77H56Z M77 63H93V70H84V84H77Z M42 84H63V93H42Z M70 86H93V93H70Z"/>
    </g>
    <text x="804" y="353" fill="#a9cbc9" font-size="16">二维码解码 → 绑定证据</text>
    <rect x="1111" y="154" width="413" height="266" rx="20" fill="#edf6f3"/>
    <path d="M1111 206H1524" stroke="#c9ddda"/>
    <text x="1137" y="186" fill="#28545b" font-size="14" font-weight="600" letter-spacing="1.3">02 / PANEL OBSERVATION</text>
    <rect x="1137" y="228" width="161" height="140" rx="12" fill="#173a42"/>
    <rect x="1158" y="249" width="119" height="72" rx="7" fill="#0c232b" stroke="#4d7880"/>
    <g stroke="#86dec4" stroke-width="4" stroke-linecap="round">
      <path d="M1174 268H1190 M1174 284H1190 M1174 300H1190 M1202 268H1218 M1202 284H1218 M1202 300H1218 M1230 268H1246 M1230 284H1246 M1230 300H1246"/>
    </g>
    <circle cx="1167" cy="345" r="5" fill="#739da0"/>
    <path d="M1190 345H1266" stroke="#739da0" stroke-width="4" stroke-linecap="round"/>
    <g fill="#204a51" font-size="16" font-weight="600">
      <text x="1321" y="257">原始图像</text>
      <text x="1321" y="301">采集时间</text>
      <text x="1321" y="345">识别回执</text>
    </g>
    <g stroke="#c4dad5" stroke-width="3" stroke-linecap="round">
      <path d="M1322 271H1485 M1322 315H1485 M1322 359H1485"/>
    </g>
    <text x="1137" y="396" fill="#64867f" font-size="13">示意图 · 非现场截图或实际测量</text>
    <g fill="none" stroke="#75d8c1" stroke-width="2" marker-end="url(#arrow)">
      <path d="M1083 263H1100"/>
      <path d="M922 382V455H959"/>
      <path d="M1318 422V441"/>
    </g>
    <rect x="971" y="445" width="552" height="89" rx="16" fill="#163a40" stroke="#3d686c"/>
    <g fill="none" stroke="#8ce5cd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1004 466H1033L1042 475V511H1004Z M1033 466V477H1042 M1013 489H1033 M1013 499H1029"/>
    </g>
    <text x="1064" y="481" fill="#e6f6f1" font-size="19" font-weight="600">每条结果，都有据可查</text>
    <text x="1064" y="510" fill="#92b9b8" font-size="15">原图 / 哈希 / 时间 / 已有身份关联</text>
  </g>
</svg>
