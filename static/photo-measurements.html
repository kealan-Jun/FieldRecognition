<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>拍照测量 · 草稿与确认</title><link rel="icon" href="/static/BrandLogo.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f7;color:#173d43;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}a{color:#237b83}button,input,select,textarea{font:inherit;border:1px solid #ccdcdf;border-radius:7px;padding:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#236b70;color:white}main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding-top:0}.card{background:white;border:1px solid #d5e1e3;border-radius:12px;padding:20px;margin-bottom:16px}.muted,small{color:#57747b}#list button{width:100%;text-align:left;margin-bottom:10px}#notice{white-space:pre-wrap;color:#9e4c28}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.photos img{width:100%;height:180px;object-fit:contain;background:#eef3f4}.photos figure{margin:0}.fields{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #dae4e6}td input,td select{max-width:160px;width:100%}td small{display:block;max-width:300px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:block;margin:10px 0}textarea{width:100%}.issues{background:#fff5e7;padding:12px 16px;border-radius:8px}details{margin-top:12px}pre{overflow:auto;max-height:320px;font-size:12px}#editor[hidden]{display:none}@media(max-width:850px){main{grid-template-columns:1fr}header{align-items:start;gap:16px}.photos img{height:150px}}
</style></head><body>
<header><div><h1>拍照测量</h1><span id="policy" class="muted">正在读取运行模式</span></div><a href="/#workspace">返回工作台</a></header>
<main><div><section class="card"><strong>最近测量</strong><p class="muted">一次连拍对应一份测量草稿。</p><button id="reload">刷新列表</button><div id="list"></div></section></div>
<div><p id="notice" role="status"></p><details class="card"><summary>设备占用与交接</summary><p>扫码不会接管正在使用的仪器。原使用人确认交出后，指定接收人再确认接收。</p><label>正在使用的仪器<select id="handoffBinding"></select></label><label>接收相机的扫码凭证<select id="handoffScan"></select></label><label>接收人<input id="handoffRecipient" maxlength="80"></label><button id="requestHandoff">申请交接</button><label>本次确认操作人<input id="handoffActor" maxlength="80"></label><div id="handoffs"></div></details><div id="empty" class="card">选择一份测量，查看照片、字段与识别依据。测试模式的结果不会写入生产实验记录。</div>
<section id="editor" hidden><div class="card"><h2 id="title"></h2><p id="meta" class="muted"></p><div id="sources" class="photos"></div></div>
<div class="card"><h2>字段与依据</h2><div id="issues" class="issues"></div><div id="fields" class="fields"></div>
<form id="revisionForm"><label>实验上下文引用<input id="context" maxlength="2000" placeholder="实验记录或步骤的引用"></label><div id="times"></div>
<label>校正原因<textarea id="reason" maxlength="1000" rows="2" placeholder="选择需校正的字段，填写依据；原始识别值会保留"></textarea></label>
<div class="actions"><label>操作人<input id="actor" required maxlength="100" autocomplete="name"></label><button id="save" type="submit">保存校正</button><button id="confirm" type="button" class="primary">确认并提交实验记录</button><button id="reject" type="button">放弃本次草稿</button></div></form>
<details><summary>原始识别与修订回执</summary><pre id="receipt"></pre></details></div></section></div></main>
<script src="/static/photo-measurements.js?v=1a8689ebbcff"></script></body></html>
