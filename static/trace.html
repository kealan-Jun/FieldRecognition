<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>按时间追溯 · 现场识别</title>
    <link rel="icon" href="/static/BrandLogo.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f6f5;
        color: #18332e;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 1200px;
        margin: auto;
        padding: 28px;
      }
      a {
        color: #166b56;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 30px;
      }
      .intro,
      .muted {
        color: #5b6d66;
      }
      .toolbar,
      .event {
        background: white;
        border: 1px solid #d7e2dc;
        border-radius: 12px;
        padding: 20px;
        margin: 18px 0;
      }
      form {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: end;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 14px;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 9px;
        border: 1px solid #b5c7bd;
        border-radius: 6px;
      }
      button {
        cursor: pointer;
        background: #176d56;
        color: white;
        border: 0;
        padding: 11px 20px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .event header {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .tag {
        padding: 3px 10px;
        border-radius: 20px;
        background: #e2eee8;
        font-size: 14px;
      }
      .sources {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }
      .source {
        border-top: 1px solid #e2e8e4;
        padding-top: 14px;
        min-width: 0;
      }
      .source img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        background: #edf1ed;
        border-radius: 5px;
      }
      .reading {
        font-size: 19px;
        font-weight: 600;
      }
      .warning {
        color: #95591c;
      }
      .error {
        color: #a33535;
      }
      small {
        display: block;
        font-size: 13px;
      }
      pre {
        overflow: auto;
        font-size: 12px;
        background: #f5f7f5;
        padding: 12px;
      }
      #status {
        min-height: 26px;
      }
      footer {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      details {
        margin: 8px 0;
      }
      @media (max-width: 600px) {
        main {
          padding: 16px;
        }
        .toolbar,
        .event {
          padding: 14px;
        }
        form label {
          width: 100%;
        }
        form input,
        form select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/#history">← 返回工作台</a>
      <h1>按时间追溯</h1>
      <p class="intro">
        在同一采集时间轴查看视频自动留证和语音三连拍，打开当时画面核对读数。
      </p>
      <section class="toolbar">
        <form id="query">
          <label
            >相机<select id="camera" required>
              <option value="">正在读取相机…</option>
            </select></label
          >
          <label
            >开始时间（北京时间）<input
              id="start"
              type="datetime-local"
              step="1"
              required
          /></label>
          <label
            >结束时间（北京时间）<input
              id="end"
              type="datetime-local"
              step="1"
              required
          /></label>
          <label
            >采集来源<select id="stream">
              <option value="all">两条采集线</option>
              <option value="video">视频自动留证</option>
              <option value="voice">语音拍照</option>
            </select></label
          >
          <button id="search" type="submit">查询证据</button>
        </form>
        <p class="muted">
          保留每张照片的时间来源。设备时钟同步状态和文件名时间不能作为同等精度的证明；时间接近的事件不会自动合并。
        </p>
      </section>
      <p id="status" role="status" aria-live="polite">选择相机和时间范围。</p>
      <section id="events" aria-label="时间顺序的采集证据"></section>
      <footer>
        <button id="previous" disabled>上一页</button
        ><button id="next" disabled>下一页</button
        ><button id="export" disabled>导出当前页 JSON</button>
      </footer>
    </main>
    <script src="/static/view-utils.js?v=structure-1"></script>
    <script src="/static/auth-session.js?v=structure-1"></script>
    <script src="/static/trace.js?v=structure-1"></script>
  </body>
</html>
