<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 现场识别</title><style>body{font:16px system-ui;background:#eef4f4;color:#173f45;display:grid;place-items:center;min-height:95vh}main{background:white;padding:36px;border:1px solid #dae5e6;border-radius:16px;width:min(340px,80vw)}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px;font:inherit;border:1px solid #c5d7d9;border-radius:8px}button{background:#1b555c;color:white;cursor:pointer}#error{color:#a43326}</style><main><h1>现场识别</h1><p>登录后查看相机、绑定与读数记录。</p><form><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p id="error" role="alert"></p></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.detail||j.error?.message||'登录失败');sessionStorage.setItem('field_csrf',j.csrf_token);location.replace('/')}catch(err){document.querySelector('#error').textContent=err.message}};</script></html>
